name: Build and Deploy Employee App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t employee-app .

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/employee-devops-project
            git pull origin main
            sudo docker build -t employee-app .
            sudo docker stop employee-app-container || true
            sudo docker rm employee-app-container || true
            sudo docker run -d -p 5000:5000 --name employee-app-container employee-app
            sudo docker ps